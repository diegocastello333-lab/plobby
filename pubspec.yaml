name: plobby
description: Plobby — social and competitive padel app.
publish_to: none
version: 1.3.1+5   # sube con cada APK entregado (splash + banner + presencia)
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  gal: ^2.3.0            # guardar PNG en la galería (pide permisos en iOS/Android)
  image_picker: ^1.1.2   # foto de perfil desde la galería (onboarding / editar perfil)
  supabase_flutter: ^2.5.0   # Auth con Google, RPC, Realtime, Storage (cliente único en main.dart cuando Env.hasSupabase)
  flutter_svg: ^2.3.4
  http: ^1.6.0
  image: ^4.12.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/   # home_banner.jpg: foto del banner del Home, extraída del prototipo HTML
  # Fuentes del prototipo HTML, empaquetadas (OFL, ver assets/fonts/OFL-*.txt). Sin descarga en tiempo de ejecución.
  fonts:
    - family: Inter
      fonts:
        - {asset: assets/fonts/Inter-Regular.ttf, weight: 400}
        - {asset: assets/fonts/Inter-Medium.ttf, weight: 500}
        - {asset: assets/fonts/Inter-SemiBold.ttf, weight: 600}
        - {asset: assets/fonts/Inter-Bold.ttf, weight: 700}
        - {asset: assets/fonts/Inter-ExtraBold.ttf, weight: 800}
    - family: Unbounded
      fonts:
        - {asset: assets/fonts/Unbounded-Medium.ttf, weight: 500}
        - {asset: assets/fonts/Unbounded-SemiBold.ttf, weight: 600}
        - {asset: assets/fonts/Unbounded-Bold.ttf, weight: 700}
