<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: la app ocupa toda la pantalla del iPhone y Flutter recibe las áreas seguras (notch, isla
       dinámica, indicador de inicio) a través de env(safe-area-inset-*); los SafeArea de la app hacen el resto. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Plobby: tu pádel con amigos. Partidos, ligas, torneos, ranking y estadísticas.">
  <!-- Fase de pruebas privada: que no aparezca en buscadores (también se envía como cabecera X-Robots-Tag). -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F6F8F1">
  <meta name="format-detection" content="telephone=no">

  <!-- iPhone: «Añadir a pantalla de inicio» → app a pantalla completa, con nombre e icono de Plobby. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plobby">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="manifest" href="manifest.json">
  <title>Plobby</title>

  <style>
    /* Base: sin rebote elástico del navegador, sin selección accidental ni resaltado gris al tocar, sin zoom de texto
       automático al girar. El desplazamiento lo gestiona Flutter. */
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #F6F8F1;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    /* Pantalla de carga: la misma que la app nativa (fondo lima con el logotipo), mientras se descarga el motor. */
    #plobby-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: #D2F548;
      transition: opacity .35s ease-out;
    }
    #plobby-splash img { width: 112px; height: 112px; border-radius: 26px; }
    #plobby-splash.done { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #plobby-splash { transition: none; } }
    /* Aviso de versión nueva (lo muestra sw-register cuando hay un despliegue nuevo). */
    #plobby-update {
      position: fixed; z-index: 20; left: 16px; right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      display: none; align-items: center; gap: 12px;
      padding: 12px 12px 12px 16px; border-radius: 14px;
      background: #171C19; color: #F6F8F1; box-shadow: 0 8px 32px rgba(23,28,25,.25);
      font: 500 14px/1.3 -apple-system, system-ui, sans-serif;
    }
    #plobby-update.show { display: flex; }
    #plobby-update span { flex: 1; }
    #plobby-update button {
      min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px;
      background: #D2F548; color: #171C19; font: 700 14px -apple-system, system-ui, sans-serif;
    }
    #plobby-noscript { font: 16px -apple-system, system-ui, sans-serif; padding: 24px; color: #171C19; }
  </style>
</head>
<body>
  <div id="plobby-splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <div id="plobby-update" role="status">
    <span>Hay una versión nueva de Plobby.</span>
    <button type="button" id="plobby-update-btn">Actualizar</button>
  </div>
  <noscript><p id="plobby-noscript">Plobby necesita JavaScript activado.</p></noscript>

  <script>
    // Quita la pantalla de carga cuando Flutter pinta su primer fotograma (la app muestra entonces su propio splash).
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('plobby-splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 400);
    });

    // Service worker propio (ver sw.js): solo la app va a caché, nunca los datos de Supabase.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          var banner = document.getElementById('plobby-update');
          function offer(worker) {
            if (!worker || !navigator.serviceWorker.controller) return;   // primera instalación: nada que actualizar
            banner.classList.add('show');
            document.getElementById('plobby-update-btn').onclick = function () { worker.postMessage('skipWaiting'); };
          }
          if (reg.waiting) offer(reg.waiting);
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            w && w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
          });
          // Al volver a la app (desde otra app o la pantalla de inicio), buscar si hay un despliegue nuevo.
          document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
        });
        // Recargar solo cuando se sustituye una versión anterior (en la primera instalación no hace falta).
        var hadController = !!navigator.serviceWorker.controller, reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloading || !hadController) return;
          reloading = true;
          location.reload();
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
